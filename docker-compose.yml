version: '3.8'

# ============================================
# Rclone Backup Web V2.0 - Docker Compose 配置
# 简化版：仅 PostgreSQL + Hub (内嵌前端)
# ============================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: rclone-backup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rclone_backup}
      POSTGRES_USER: ${DB_USER:-rclone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # 使用绑定挂载 - 数据存储在 ./data/postgres
      - ./data/postgres:/var/lib/postgresql/data
      - ./hub/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rclone} -d ${DB_NAME:-rclone_backup}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Hub (Go API + 内嵌前端)
  # ============================================
  hub:
    build:
      context: .
      dockerfile: ./hub/Dockerfile
      args:
        - GO_VERSION=1.23
    image: rclone-backup-hub:${VERSION:-latest}
    container_name: rclone-backup-hub
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-rclone}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      DB_NAME: ${DB_NAME:-rclone_backup}
      DATABASE_URL: postgres://${DB_USER:-rclone}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rclone_backup}?sslmode=disable
      
      # Security Keys (Required)
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key required}
      
      # Server Configuration
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Features
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      
      # Session Configuration
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-24h}
      API_KEY_EXPIRY: ${API_KEY_EXPIRY:-365d}
      
      # Local Agent URL (for TestRemote)
      LOCAL_AGENT_URL: ${LOCAL_AGENT_URL:-http://host.docker.internal:9092}
      LOCAL_AGENT_TOKEN: ${LOCAL_AGENT_TOKEN:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    ports:
      - "${WEB_PORT:-3000}:8080"
    volumes:
      - ./data/hub/data:/data
      - ./data/hub/logs:/app/logs
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    extra_hosts:
      # 允许容器访问宿主机上的服务 (本地Agent)
      - "host.docker.internal:host-gateway"

  # ============================================
  # OPTIONAL: Database Backup Service
  # ============================================
  db-backup:
    image: postgres:15-alpine
    container_name: rclone-backup-db-backup
    profiles:
      - db-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/backups:/backups
    networks:
      - backend
    command: >
      sh -c "while true; do
        echo 'Backing up database...';
        pg_dump -h postgres -U ${DB_USER:-rclone} ${DB_NAME:-rclone_backup} | 
        gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz;
        echo 'Backup complete';
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep ${DB_BACKUP_INTERVAL:-86400};
      done"
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Networks
# ============================================
networks:
  backend:
    driver: bridge
