version: '3.8'

services:
  # Rclone Agent
  agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    container_name: rclone-agent
    environment:
      HUB_URL: ${HUB_URL:-http://hub.example.com}
      AGENT_ID: ${AGENT_ID}
      AGENT_API_KEY: ${AGENT_API_KEY}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30s}
      CONFIG_CACHE_DIR: /var/lib/rclone-agent
      RCLONE_ENDPOINT: http://rclone-sidecar:5572
    volumes:
      - agent_config:/var/lib/rclone-agent
      - /var/www:/var/www:ro  # Example source paths to backup
      - /home:/home:ro
      - /etc:/etc:ro
    networks:
      - agent-network
    depends_on:
      - rclone-sidecar
    restart: unless-stopped

  # Rclone Sidecar
  rclone-sidecar:
    image: rclone/rclone:latest
    container_name: rclone-sidecar
    command: rcd --rc-addr :5572 --rc-no-auth --rc-web-gui --rc-web-gui-no-open-browser
    environment:
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      - rclone_config:/config
      - /var/www:/var/www:ro
      - /home:/home:ro
      - /etc:/etc:ro
    networks:
      - agent-network
    ports:
      - "5572:5572"  # Expose for debugging, remove in production
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge

volumes:
  agent_config:
  rclone_config: