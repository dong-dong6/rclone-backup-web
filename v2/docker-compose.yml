version: '3.8'

# ============================================
# Rclone Backup Web V2.0 - Docker Compose 配置
# 使用绑定挂载实现透明的数据持久化
# ============================================

services:
  # ============================================
  # HUB SERVICES (Always On)
  # ============================================
  
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rclone-backup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rclone_backup}
      POSTGRES_USER: ${DB_USER:-rclone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # 使用绑定挂载 - 数据存储在 ./data/postgres
      - ./data/postgres:/var/lib/postgresql/data
      - ./hub/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rclone} -d ${DB_NAME:-rclone_backup}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Hub API Server (Go)
  hub-api:
    build:
      context: ./hub
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.21
    image: rclone-backup-hub:${VERSION:-latest}
    container_name: rclone-backup-hub
    restart: unless-stopped
    environment:
      # Database Configuration (CRITICAL: Use service name, not localhost!)
      DB_HOST: postgres
      DATABASE_URL: postgres://${DB_USER:-rclone}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rclone_backup}?sslmode=disable
      
      # Security Keys (Required)
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key required}
      
      # Server Configuration - 强制使用 8080，忽略环境变量
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Features
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      ENABLE_PROFILING: ${ENABLE_PROFILING:-false}
      
      # Session Configuration
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-24h}
      API_KEY_EXPIRY: ${API_KEY_EXPIRY:-365d}
    # 不再对外暴露端口，只在内部网络访问
    # ports:
    #   - "${HUB_PORT:-8080}:8080"
    #   - "${METRICS_PORT:-9090}:9090"
    volumes:
      # 使用绑定挂载 - 配置和数据存储在 ./data/hub
      - ./hub/config:/app/config:ro
      - ./data/hub/data:/data
      - ./data/hub/logs:/app/logs
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 使用 wget 检查健康端点，确保返回 200
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s  # 给服务充足的启动时间

  # Web UI (React)
  web-ui:
    build:
      context: ./hub/web
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=20-alpine
    image: rclone-backup-web:${VERSION:-latest}
    container_name: rclone-backup-web
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${API_URL:-http://localhost:8080}
      REACT_APP_SSE_URL: ${SSE_URL:-http://localhost:8080}
      REACT_APP_VERSION: ${VERSION:-latest}
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - backend
    depends_on:
      - hub-api
    healthcheck:
      # Nginx 容器使用 curl 检查（已安装）
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cache/Session Store
  redis:
    image: redis:7-alpine
    container_name: rclone-backup-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      # 使用绑定挂载 - 数据存储在 ./data/redis
      - ./data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # OPTIONAL: Database Backup Service
  # ============================================
  
  # 定期备份数据库的服务
  db-backup:
    image: postgres:15-alpine
    container_name: rclone-backup-db-backup
    profiles:
      - db-backup  # 可选profile，用于定期备份
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      # 使用绑定挂载 - 备份存储在 ./data/backups
      - ./data/backups:/backups
    networks:
      - backend
    command: >
      sh -c "while true; do
        echo 'Backing up database...';
        pg_dump -h postgres -U ${DB_USER:-rclone} ${DB_NAME:-rclone_backup} | 
        gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz;
        echo 'Backup complete: backup-$$(date +%Y%m%d-%H%M%S).sql.gz';
        echo 'Cleaning old backups (keeping last 7 days)...';
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep ${DB_BACKUP_INTERVAL:-86400};
      done"
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Networks
# ============================================
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1