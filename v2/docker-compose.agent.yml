version: '3.8'

# ============================================
# 独立Agent部署配置 - 用于远程服务器
# ============================================

services:
  # Agent Service
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.21
    image: rclone-backup-agent:${VERSION:-latest}
    container_name: rclone-agent-${AGENT_NAME:-default}
    restart: unless-stopped
    environment:
      # Hub连接配置（必需）
      HUB_URL: ${HUB_URL:?Hub URL required}
      
      # 注册方式（二选一）
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}  # 首次注册
      AGENT_ID: ${AGENT_ID:-}                      # 已注册
      AGENT_API_KEY: ${AGENT_API_KEY:-}            # 已注册
      
      # Agent配置
      AGENT_NAME: ${AGENT_NAME:-agent-$(hostname)}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30s}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-2h}
      
      # Rclone Sidecar配置
      RCLONE_ENDPOINT: http://rclone-sidecar:5572
      RCLONE_RC_USER: ${RCLONE_RC_USER:-}
      RCLONE_RC_PASS: ${RCLONE_RC_PASS:-}
      USE_SIDECAR: ${USE_SIDECAR:-true}
      
      # 本地回退
      ENABLE_LOCAL_FALLBACK: ${ENABLE_LOCAL_FALLBACK:-true}
      LOCAL_FALLBACK_THRESHOLD: ${LOCAL_FALLBACK_THRESHOLD:-5m}
      CONFIG_CACHE_DIR: /data/config
      
      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /data/logs/agent.log
    volumes:
      # Agent配置和缓存
      - agent_data:/data
      
      # 备份源路径（根据实际需求修改）
      - ${BACKUP_SOURCE_1:-/var/www}:/backup/www:ro
      - ${BACKUP_SOURCE_2:-/home}:/backup/home:ro
      - ${BACKUP_SOURCE_3:-/etc}:/backup/etc:ro
      
      # 添加更多路径：
      # - /path/on/host:/backup/name:ro
    networks:
      - agent-network
    depends_on:
      rclone-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Rclone Sidecar
  rclone-sidecar:
    image: rclone/rclone:${RCLONE_VERSION:-latest}
    container_name: rclone-sidecar-${AGENT_NAME:-default}
    restart: unless-stopped
    command: >
      rcd
      --rc-addr :5572
      --rc-no-auth
      --rc-web-gui
      --rc-web-gui-no-open-browser
      --rc-web-gui-update
      --log-level ${RCLONE_LOG_LEVEL:-INFO}
      --log-file /logs/rclone.log
      --cache-dir /cache
      --config /config/rclone.conf
      ${RCLONE_EXTRA_FLAGS:-}
    environment:
      RCLONE_CONFIG: /config/rclone.conf
      RCLONE_CACHE_DIR: /cache
      RCLONE_TEMP_DIR: /tmp
    volumes:
      # Rclone配置和缓存
      - rclone_config:/config
      - rclone_cache:/cache
      - rclone_logs:/logs
      
      # 与Agent共享数据卷
      - agent_data:/data:rw
      
      # 相同的备份源路径
      - ${BACKUP_SOURCE_1:-/var/www}:/backup/www:ro
      - ${BACKUP_SOURCE_2:-/home}:/backup/home:ro
      - ${BACKUP_SOURCE_3:-/etc}:/backup/etc:ro
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "rclone", "rc", "--rc-addr", ":5572", "core/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${RCLONE_CPU_LIMIT:-2.0}'
          memory: ${RCLONE_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  agent-network:
    driver: bridge

volumes:
  agent_data:
    driver: local
  rclone_config:
    driver: local
  rclone_cache:
    driver: local
  rclone_logs:
    driver: local