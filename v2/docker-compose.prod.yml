# ============================================
# Rclone Backup Web V2.0 - Production Docker Compose
# 使用绑定挂载实现透明的数据持久化
# ============================================

services:
  # ============================================
  # Database (PostgreSQL)
  # ============================================
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-rclone_backup}
      POSTGRES_USER: ${DB_USER:-rclone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      # 使用绑定挂载 - 数据存储在 ./data/postgres
      - ./data/postgres:/var/lib/postgresql/data
      - ./hub/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rclone} -d ${DB_NAME:-rclone_backup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Cache Layer (Redis)
  # ============================================
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      # 使用绑定挂载 - 数据存储在 ./data/redis
      - ./data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Hub API Server
  # ============================================
  hub-api:
    build:
      context: ./hub
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-latest}
    image: rclone-backup-hub:${VERSION:-latest}
    restart: always
    environment:
      # Database Configuration (Use service name, not localhost!)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rclone_backup}
      DB_USER: ${DB_USER:-rclone}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Security Keys
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key required}
      
      # Server Configuration - 强制使用 8080，忽略环境变量
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # 不再对外暴露端口，只在内部网络访问
    # ports:
    #   - "${HUB_PORT:-8080}:8080"
    #   - "${METRICS_PORT:-9090}:9090"
    volumes:
      # 使用绑定挂载 - 配置和数据存储在 ./data/hub
      - ./data/hub/config:/app/config
      - ./data/hub/data:/app/data
      - ./data/hub/logs:/app/logs
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Web UI (React)
  # ============================================
  web-ui:
    build:
      context: ./hub/web
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:${HUB_PORT:-8080}
        SSE_URL: http://localhost:${HUB_PORT:-8080}
    image: rclone-backup-web:${VERSION:-latest}
    restart: always
    environment:
      API_URL: http://localhost:${HUB_PORT:-8080}
      SSE_URL: http://localhost:${HUB_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - backend
    depends_on:
      - hub-api

  # ============================================
  # Database Backup Service (OPTIONAL)
  # Profile: db-backup
  # ============================================
  db-backup:
    image: postgres:15-alpine
    profiles:
      - db-backup
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Database password required}
    command: |
      sh -c 'while true; do
        echo "[$(date)] Starting database backup..."
        pg_dump -h postgres -U ${DB_USER:-rclone} ${DB_NAME:-rclone_backup} | gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz
        echo "[$(date)] Backup completed"
        
        # 清理30天前的备份
        find /backups -name "backup-*.sql.gz" -mtime +30 -delete
        echo "[$(date)] Old backups cleaned"
        
        # 等待指定时间
        sleep ${DB_BACKUP_INTERVAL:-86400}
      done'
    volumes:
      # 使用绑定挂载 - 备份存储在 ./data/backups
      - ./data/backups:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Networks
# ============================================
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1